<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador de Notas</title>
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="resultado" class="result">
      <span>Valor total: <br />R$ 0,00</span>
    </div>

    <div id="contadorNotas" class="container">
      <div class="row">
        <div class="col-12 col-md-6 col-lg-12">
          <div class="lista-notas text-white">
            <div class="row">
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item200">
                R$: 200 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item100">
                R$: 100 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item50">
                R$: 50 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item20">
                R$: 20 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item10">
                R$: 10 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item5">
                R$: 5 = 0
              </div>
              <div class="col-4 col-md-4 col-lg-2 fs-6 contNotas" id="item2">
                R$: 2 = 0
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container pt-lg-1" id="content">
      <h1 class="custom-mt pt-lg-1">Contador de Notas</h1>

      <div class="campo-nota" id="container-nota200">
        <label for="nota200">Quantidade de notas de R$200:</label>
        <input
          type="number"
          id="nota200"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma200" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota" id="container-nota100">
        <label for="nota100">Quantidade de notas de R$100:</label>
        <input
          type="number"
          id="nota100"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma100" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota" id="container-nota50">
        <label for="nota50">Quantidade de notas de R$50:</label>
        <input
          type="number"
          id="nota50"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma50" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota" id="container-nota20">
        <label for="nota20">Quantidade de notas de R$20:</label>
        <input
          type="number"
          id="nota20"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma20" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota" id="container-nota10">
        <label for="nota10">Quantidade de notas de R$10:</label>
        <input
          type="number"
          id="nota10"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma10" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota" id="container-nota5">
        <label for="nota5">Quantidade de notas de R$5:</label>
        <input
          type="number"
          id="nota5"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma5" class="nota-soma">Soma: R$ 0,00</div>
      </div>

      <div class="campo-nota nota2" id="container-nota2">
        <label for="nota2">Quantidade de notas de R$2:</label>
        <input
          type="number"
          id="nota2"
          oninput="calcularTotal()"
          placeholder="Digite a quantidade"
        />
        <div id="soma2" class="nota-soma">Soma: R$ 0,00</div>
      </div>
    </div>

    <footer>
      <div class="footer-fixed">
        <div class="buttons">
          <button onclick="resetarCampos()">Zerar Campos</button>
          <button onclick="tirarPrint()">Tirar Print</button>
        </div>
      </div>

      <div
        class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
      >
        <div class="col-md-4 d-flex align-items-center">
          <a
            href="/"
            class="mb-3 me-2 mb-md-0 text-muted text-decoration-none lh-1"
          >
            <svg class="bi" width="30" height="24">
              <use xlink:href="#bootstrap"></use>
            </svg>
          </a>
          <span class="mb-3 mb-md-0 text-muted"
            >© 2024 Todos os direitos reservados<br />Luiz Henrique Santos</span
          >
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
